<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title | default: "THE DOC MASTER" }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <meta name="color-scheme" content="light dark">
  <script>
    // Applied before first paint to avoid a theme / sidebar flash.
    (function () {
      var d = document.documentElement;
      var mode = 'system';
      try { mode = localStorage.getItem('docucraft_theme') || 'system'; } catch (e) {}
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      d.setAttribute('data-theme', dark ? 'dark' : 'light');
      d.setAttribute('data-theme-mode', mode);
      try {
        if (localStorage.getItem('docucraft_gh_sidebar_hidden') === 'true') d.classList.add('sidebar-hidden');
        var w = parseInt(localStorage.getItem('docucraft_gh_sidebar_width'), 10);
        if (w >= 220 && w <= 750) d.style.setProperty('--sidebar-w', w + 'px');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
